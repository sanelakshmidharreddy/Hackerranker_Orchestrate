services:
  - type: web
    name: ghost-data-backend
    env: python
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: FRONTEND_ORIGIN
        value: "*"

  - type: web
    name: ghost-data-frontend
    env: static
    rootDir: frontend
    staticPublishPath: .
